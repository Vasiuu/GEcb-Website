version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gecb_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: gecb_attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gecb_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: gecb_express_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/gecb_attendance?schema=public
      - JWT_SECRET=gecb_super_secure_jwt_secret_key_12345
      - PORT=5000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    # Wait for the DB to be ready, push schema & seed, then start in dev/watch mode
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
